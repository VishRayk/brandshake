name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brandshake
          POSTGRES_PASSWORD: brandshake
          POSTGRES_DB: brandshake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brandshake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRANDSHAKE_TEST_DATABASE_URL: postgres://brandshake:brandshake@localhost:5432/brandshake_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/core-api

  ai:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/ai/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
